
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRI KUVI INVESTMENT ESTATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero">

        <h2>
            SIRI KUVI INVESTMENT ESTATE DEVELOPMENT
        </h2>
        <p>
            The countdown marks the upcoming launch of a digital platform prototype designed to connect Siri Kuvi, Komagin Limited, and RML in managing and monitoring the civil works programme.

            
        </p>
        <h2 class="inst">The Platform Will Be Ready In</h2>
        <!-- Countdown -->
        <div class="countdown">
            <div>
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div>
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>
        <div class="video-container">
            <video autoplay muted playsinline>
            <source src="vid.mp4" type="video/mp4">
            Your browser does not support video.
            </video>
        </div>

    </section>


    <script>
        // Existing video implementation
        const video = document.querySelector("video");

        video.playbackRate = 13;


        // Countdown
        const targetDate = new Date("2026-09-19T18:05:59+10:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";
                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (difference % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60)) /
                1000
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
